<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${title} + ' · eMobility'">eMobility</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar(active='accounting')}"></div>
  <div class="main">
    <div th:replace="~{fragments :: topbar(title=${title})}"></div>
    <main class="content">
      <div class="card">
        <div class="card-head">
          <div><h3>General Ledger</h3><div class="text-mute" style="font-size:12px">Posted debit / credit entries by account</div></div>
          <button class="btn btn-primary" id="addBtn_ledger">+ Add Entry</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>ID</th><th>Account ID</th><th>Description</th><th>Debit</th><th>Credit</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="tbody_ledger"><tr class="empty-row"><td colspan="7">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  initCrudPage({
    key: 'ledger', endpoint: '/api/ledger', title: 'Ledger Entry',
    tableBodyId: 'tbody_ledger', addButtonId: 'addBtn_ledger',
    columns: [
      {key:'id', label:'ID'}, {key:'accountId', label:'Account ID'}, {key:'description', label:'Description'},
      {key:'debit', label:'Debit', render:r=>money(r.debit)}, {key:'credit', label:'Credit', render:r=>money(r.credit)},
      {key:'entryDate', label:'Date'}
    ],
    fields: [
      {key:'accountId', label:'Account ID', type:'number', required:true},
      {key:'description', label:'Description', required:true},
      {key:'debit', label:'Debit (₹)', type:'number', step:'0.01'},
      {key:'credit', label:'Credit (₹)', type:'number', step:'0.01'},
      {key:'entryDate', label:'Entry Date', type:'date'}
    ]
  });
});
</script>
</body>
</html>

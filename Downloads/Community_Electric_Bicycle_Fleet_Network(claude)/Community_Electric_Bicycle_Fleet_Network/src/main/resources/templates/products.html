<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${title} + ' · eMobility'">eMobility</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar(active='products')}"></div>
  <div class="main">
    <div th:replace="~{fragments :: topbar(title=${title})}"></div>
    <main class="content">
      <div class="card">
        <div class="card-head">
          <div>
            <h3>Products</h3>
            <div class="text-mute" style="font-size:12px">Spare parts, equipment and accessories master</div>
          </div>
          <button class="btn btn-primary" id="addBtn_products">+ Add Product</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Unit Price</th><th>Unit</th><th>Actions</th></tr></thead>
            <tbody id="tbody_products"><tr class="empty-row"><td colspan="6">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  initCrudPage({
    key: 'products',
    endpoint: '/api/products',
    title: 'Product',
    tableBodyId: 'tbody_products',
    addButtonId: 'addBtn_products',
    columns: [
        {key:'id', label:'ID'},
        {key:'name', label:'Name'},
        {key:'type', label:'Type', render:r=>statusBadge(r.type)},
        {key:'unitPrice', label:'Unit Price', render:r=>money(r.unitPrice)},
        {key:'unit', label:'Unit'}
    ],
    fields: [
        {key:'name', label:'Product Name', required:true},
        {key:'type', label:'Type', type:'select', options:[{value:'SPARE_PART',label:'SPARE_PART'},{value:'EQUIPMENT',label:'EQUIPMENT'},{value:'ACCESSORY',label:'ACCESSORY'},{value:'SERVICE',label:'SERVICE'}]},
        {key:'unitPrice', label:'Unit Price (₹)', type:'number', step:'0.01'},
        {key:'unit', label:'Unit (e.g. unit, box)'}
    ]
  });
});
</script>
</body>
</html>

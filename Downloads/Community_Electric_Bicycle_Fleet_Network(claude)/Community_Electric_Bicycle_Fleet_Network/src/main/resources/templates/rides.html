<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${title} + ' · eMobility'">eMobility</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar(active='rides')}"></div>
  <div class="main">
    <div th:replace="~{fragments :: topbar(title=${title})}"></div>
    <main class="content">

      <div class="grid grid-2" style="margin-bottom:18px">
        <div class="card">
          <h3>🔓 Start a Ride</h3>
          <div class="text-mute mt-8" style="font-size:12px;margin-bottom:14px">Unlocks a bike for a rider and marks it IN_RIDE</div>
          <form id="startRideForm" class="form-grid">
            <div class="form-row"><label>Rider</label><select id="startRiderId" required><option value="">Select rider</option></select></div>
            <div class="form-row"><label>Bike</label><select id="startBikeId" required><option value="">Select available bike</option></select></div>
            <div style="grid-column:1/-1"><button class="btn btn-primary w-full" type="submit">Start Ride</button></div>
          </form>
        </div>
        <div class="card">
          <h3>✅ End a Ride</h3>
          <div class="text-mute mt-8" style="font-size:12px;margin-bottom:14px">Ends the ride, calculates the fare and records a successful payment</div>
          <form id="endRideForm" class="form-grid">
            <div class="form-row"><label>Active ride</label><select id="endRideId" required><option value="">Select ride</option></select></div>
            <div class="form-row"><label>Payment method</label><select id="endPaymentMethod"><option value="CARD">Card</option><option value="UPI">UPI</option><option value="CASH">Cash</option></select></div>
            <div style="grid-column:1/-1"><button class="btn btn-primary w-full" type="submit">End Ride</button></div>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div><h3>All Rides</h3><div class="text-mute" style="font-size:12px">Every ride session recorded on the platform</div></div>
          <button class="btn btn-primary" id="addBtn_rides">+ Add Ride Record</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Ride ID</th><th>Rider</th><th>Bike</th><th>Start</th><th>End</th><th>Duration (min)</th><th>Fare</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="tbody_rides"><tr class="empty-row"><td colspan="9">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  let riders = [];
  let bikes = [];
  let rides = [];
  const riderName = id => {
    const rider = riders.find(item => String(item.id) === String(id));
    return rider ? `${rider.name} (ID ${id})` : `Rider ID ${id}`;
  };
  const bikeName = id => {
    const bike = bikes.find(item => String(item.id) === String(id));
    return bike ? `${bike.bikeCode} (ID ${id})` : `Bike ID ${id}`;
  };
  const riderOptions = () => riders.map(r => ({value:r.id, label:`${r.name} (ID ${r.id})`}));
  const bikeOptions = () => bikes.filter(b => !['IN_RIDE', 'MAINTENANCE'].includes(String(b.status).toUpperCase())).map(b => ({value:b.id, label:`${b.bikeCode} (ID ${b.id})`}));
  const activeRideOptions = () => rides.filter(r => ['ACTIVE', 'ONGOING', 'IN_RIDE'].includes(String(r.status).toUpperCase())).map(r => ({value:r.id, label:`Ride ${r.id} · ${riderName(r.riderId)} · ${bikeName(r.bikeId)}`}));

  async function loadReferenceData() {
    try {
      [riders, bikes, rides] = await Promise.all([API.get('/api/riders'), API.get('/api/bikes'), API.get('/api/rides')]);
    } catch (err) {
      toast('Could not load rider and bike names', true);
    }
    document.getElementById('startRiderId').innerHTML = '<option value="">Select rider</option>' + riderOptions().map(o => `<option value="${o.value}">${o.label}</option>`).join('');
    document.getElementById('startBikeId').innerHTML = '<option value="">Select available bike</option>' + bikeOptions().map(o => `<option value="${o.value}">${o.label}</option>`).join('');
    document.getElementById('endRideId').innerHTML = '<option value="">Select active ride</option>' + activeRideOptions().map(o => `<option value="${o.value}">${o.label}</option>`).join('');
  }

  const crud = initCrudPage({
    key: 'rides', endpoint: '/api/rides', title: 'Ride',
    tableBodyId: 'tbody_rides', addButtonId: 'addBtn_rides',
    columns: [
      {key:'id', label:'ID'}, {key:'riderId', label:'Rider', render:r=>riderName(r.riderId)}, {key:'bikeId', label:'Bike', render:r=>bikeName(r.bikeId)},
      {key:'startTime', label:'Start', render:r=>fmtDate(r.startTime)}, {key:'endTime', label:'End', render:r=>fmtDate(r.endTime)},
      {key:'durationMinutes', label:'Duration'}, {key:'fare', label:'Fare', render:r=>money(r.fare)},
      {key:'status', label:'Status', render:r=>statusBadge(r.status)}
    ],
    fields: [
      {key:'riderId', label:'Rider', type:'select', options:riderOptions, required:true},
      {key:'bikeId', label:'Bike', type:'select', options:bikeOptions, required:true},
      {key:'durationMinutes', label:'Duration (minutes)', type:'number'},
      {key:'fare', label:'Fare (₹)', type:'number', step:'0.01'},
      {key:'status', label:'Status', type:'select', options:[{value:'ACTIVE',label:'ACTIVE'},{value:'ONGOING',label:'ONGOING'},{value:'COMPLETED',label:'COMPLETED'},{value:'CANCELLED',label:'CANCELLED'}]}
    ]
  });
  loadReferenceData().then(() => crud.reload());

  document.getElementById('startRideForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await API.post('/api/rides/start', {
        riderId: Number(document.getElementById('startRiderId').value),
        bikeId: Number(document.getElementById('startBikeId').value)
      });
      toast('Ride started — bike unlocked');
      e.target.reset();
      crud.reload();
    } catch (err) { toast(err.message, true); }
  });

  document.getElementById('endRideForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const res = await API.post('/api/rides/end', {
        rideId: Number(document.getElementById('endRideId').value),
        method: document.getElementById('endPaymentMethod').value
      });
      const paymentMethod = res.payment?.method || document.getElementById('endPaymentMethod').value || 'CARD';
      const fare = res.fare ?? res.ride?.fare ?? 0;
      toast('Payment successful — ' + money(fare) + ' charged by ' + paymentMethod);
      e.target.reset();
      await loadReferenceData();
      crud.reload();
    } catch (err) { toast(err.message, true); }
  });
});
</script>
</body>
</html>

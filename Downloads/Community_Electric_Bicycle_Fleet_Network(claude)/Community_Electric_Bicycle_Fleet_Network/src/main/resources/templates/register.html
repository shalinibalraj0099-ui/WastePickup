<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${title != null ? title : 'Register'} + ' · eMobility'">Register</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-hero">
    <h1>Join the<br><span class="accent">Fleet Network</span></h1>
    <p>Create a rider account to unlock e-bikes, track rides and manage your billing.</p>
  </div>
  <div class="auth-form-side">
    <div class="auth-card">
      <div class="flex items-center gap-8" style="margin-bottom:22px">
        <div class="brand" style="padding:0;border:none"><div class="logo">🚲</div></div>
        <b>eMobility</b>
      </div>
      <h2>Create Rider Account</h2>
      <div class="sub">Register to start riding</div>
      <form id="registerForm">
        <div class="form-row">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Full name" required>
        </div>
        <div class="form-row">
          <label>Email</label>
          <input type="email" id="email" placeholder="Email" required>
        </div>
        <div class="form-row">
          <label>Password</label>
          <input type="password" id="password" placeholder="Password" required>
        </div>
        <button class="btn btn-primary w-full" type="submit">Register</button>
      </form>
      <div class="text-mute mt-16" style="font-size:12.5px">
        Already have an account? <a href="/login" style="color:var(--accent);font-weight:700">Login</a>
      </div>
    </div>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await API.post('/api/auth/register', {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    toast('Account created! Please login.');
    setTimeout(() => window.location.href = '/login', 700);
  } catch (err) {
    toast(err.message, true);
  }
});
</script>
</body>
</html>

spring.application.name=bicycle
server.port=8080

# ---------------------------------------------------------------------------
# MySQL connection
# Create the schema once with database/schema.sql (or just let Hibernate do it
# via createDatabaseIfNotExist=true + ddl-auto=update below), then update the
# username/password to match your local MySQL instance.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/micromobility?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=shalini2007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates/updates every table automatically from the JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Return clean ISO dates instead of timestamp arrays in JSON responses
spring.jackson.serialization.write-dates-as-timestamps=false

# Sample/dummy data is inserted automatically on first run by
# com.example.bicycle.config.DataInitializer (only when the bikes table is empty)

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${title} + ' · eMobility'">eMobility</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar(active='sales-orders')}"></div>
  <div class="main">
    <div th:replace="~{fragments :: topbar(title=${title})}"></div>
    <main class="content">
      <div class="card">
        <div class="card-head">
          <div>
            <h3>Sales Orders</h3>
            <div class="text-mute" style="font-size:12px">Sponsorship & bulk sales orders from corporate partners</div>
          </div>
          <button class="btn btn-primary" id="addBtn_so">+ New Order</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>SO No.</th><th>Sponsor ID</th><th>Item</th><th>Qty</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="tbody_so"><tr class="empty-row"><td colspan="8">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  initCrudPage({
    key: 'so',
    endpoint: '/api/sales-orders',
    title: 'Sales Order',
    tableBodyId: 'tbody_so',
    addButtonId: 'addBtn_so',
    columns: [
        {key:'id', label:'SO No.'},
        {key:'sponsorId', label:'Sponsor ID'},
        {key:'productName', label:'Item'},
        {key:'quantity', label:'Qty'},
        {key:'totalAmount', label:'Total', render:r=>money(r.totalAmount)},
        {key:'status', label:'Status', render:r=>statusBadge(r.status)},
        {key:'orderDate', label:'Date'}
    ],
    fields: [
        {key:'sponsorId', label:'Sponsor ID', type:'number', required:true},
        {key:'productName', label:'Item / Package'},
        {key:'quantity', label:'Quantity', type:'number'},
        {key:'totalAmount', label:'Total Amount (₹)', type:'number', step:'0.01'},
        {key:'status', label:'Status', type:'select', options:[{value:'CREATED',label:'CREATED'},{value:'CONFIRMED',label:'CONFIRMED'},{value:'DELIVERED',label:'DELIVERED'},{value:'CANCELLED',label:'CANCELLED'}]},
        {key:'orderDate', label:'Order Date', type:'date'}
    ]
  });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${title != null ? title : 'Login'} + ' · eMobility'">Login</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-hero">
    <h1>Green Rides<br><span class="accent">Better Cities</span></h1>
    <p>Smart e-bike GPS tracking, dock charging, rider billing and fleet accounting — all in one platform.</p>
  </div>
  <div class="auth-form-side">
    <div class="auth-card">
      <div class="flex items-center gap-8" style="margin-bottom:22px">
        <div class="brand" style="padding:0;border:none"><div class="logo">🚲</div></div>
        <b>eMobility</b>
      </div>
      <h2>Welcome Back</h2>
      <div class="sub">Sign in to your account</div>
      <form id="loginForm">
        <div class="form-row">
          <label>Email or Username</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-row">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button class="btn btn-primary w-full" type="submit">Login</button>
      </form>
      <div class="text-mute mt-16" style="font-size:12.5px">
        Don't have an account? <a href="/register" style="color:var(--accent);font-weight:700">Register</a>
      </div>
      <div class="text-mute mt-16" style="font-size:11.5px">Demo admin login: admin@ebike.com / admin123</div>
    </div>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const user = await API.post('/api/auth/login', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    localStorage.setItem('currentUser', JSON.stringify(user));
    toast('Welcome back, ' + user.name);
    setTimeout(() => window.location.href = '/dashboard', 500);
  } catch (err) {
    toast(err.message, true);
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${title} + ' · eMobility'">eMobility</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar(active='contacts')}"></div>
  <div class="main">
    <div th:replace="~{fragments :: topbar(title=${title})}"></div>
    <main class="content">

      <div class="flex gap-8 mt-8" style="margin-bottom:16px">
        <button class="btn btn-outline tab-btn active" data-tab="riders">Riders</button>
        <button class="btn btn-outline tab-btn" data-tab="vendors">Vendors</button>
        <button class="btn btn-outline tab-btn" data-tab="sponsors">Corporate Sponsors</button>
      </div>

      <div id="panel-riders" class="tab-panel">
        <div class="card">
          <div class="card-head">
            <div><h3>Riders</h3><div class="text-mute" style="font-size:12px">Registered riders / customers</div></div>
            <button class="btn btn-primary" id="addBtn_riders">+ Add Rider</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead>
              <tbody id="tbody_riders"><tr class="empty-row"><td colspan="5">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="panel-vendors" class="tab-panel hidden">
        <div class="card">
          <div class="card-head">
            <div><h3>Vendors</h3><div class="text-mute" style="font-size:12px">Parts & equipment suppliers</div></div>
            <button class="btn btn-primary" id="addBtn_vendors">+ Add Vendor</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Actions</th></tr></thead>
              <tbody id="tbody_vendors"><tr class="empty-row"><td colspan="6">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="panel-sponsors" class="tab-panel hidden">
        <div class="card">
          <div class="card-head">
            <div><h3>Corporate Sponsors</h3><div class="text-mute" style="font-size:12px">Sponsorship & B2B partners</div></div>
            <button class="btn btn-primary" id="addBtn_sponsors">+ Add Sponsor</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>ID</th><th>Company</th><th>Contact Person</th><th>Email</th><th>Actions</th></tr></thead>
              <tbody id="tbody_sponsors"><tr class="empty-row"><td colspan="5">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.remove('hidden');
    });
  });

  initCrudPage({
    key: 'riders', endpoint: '/api/riders', title: 'Rider',
    tableBodyId: 'tbody_riders', addButtonId: 'addBtn_riders',
    columns: [
      {key:'id', label:'ID'}, {key:'name', label:'Name'}, {key:'email', label:'Email'}, {key:'phone', label:'Phone'}
    ],
    fields: [
      {key:'name', label:'Full Name', required:true},
      {key:'email', label:'Email', type:'email', required:true},
      {key:'phone', label:'Phone'}
    ]
  });

  initCrudPage({
    key: 'vendors', endpoint: '/api/vendors', title: 'Vendor',
    tableBodyId: 'tbody_vendors', addButtonId: 'addBtn_vendors',
    columns: [
      {key:'id', label:'ID'}, {key:'name', label:'Name'}, {key:'email', label:'Email'}, {key:'phone', label:'Phone'}, {key:'address', label:'Address'}
    ],
    fields: [
      {key:'name', label:'Vendor Name', required:true},
      {key:'email', label:'Email', type:'email'},
      {key:'phone', label:'Phone'},
      {key:'address', label:'Address'}
    ]
  });

  initCrudPage({
    key: 'sponsors', endpoint: '/api/sponsors', title: 'Sponsor',
    tableBodyId: 'tbody_sponsors', addButtonId: 'addBtn_sponsors',
    columns: [
      {key:'id', label:'ID'}, {key:'companyName', label:'Company'}, {key:'contactName', label:'Contact Person'}, {key:'email', label:'Email'}
    ],
    fields: [
      {key:'companyName', label:'Company Name', required:true},
      {key:'contactName', label:'Contact Person'},
      {key:'email', label:'Email', type:'email'}
    ]
  });
});
</script>
</body>
</html>

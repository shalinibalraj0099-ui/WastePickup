<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${title} + ' · eMobility'">eMobility</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar(active='invoices')}"></div>
  <div class="main">
    <div th:replace="~{fragments :: topbar(title=${title})}"></div>
    <main class="content">
      <div class="card">
        <div class="card-head">
          <div>
            <h3>Customer Invoices</h3>
            <div class="text-mute" style="font-size:12px">Invoices raised against sales orders / sponsors</div>
          </div>
          <button class="btn btn-primary" id="addBtn_invoices">+ New Invoice</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Invoice No.</th><th>SO No.</th><th>Sponsor ID</th><th>Amount</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="tbody_invoices"><tr class="empty-row"><td colspan="7">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  initCrudPage({
    key: 'invoices',
    endpoint: '/api/invoices',
    title: 'Customer Invoice',
    tableBodyId: 'tbody_invoices',
    addButtonId: 'addBtn_invoices',
    columns: [
        {key:'id', label:'Invoice No.'},
        {key:'salesOrderId', label:'SO No.'},
        {key:'sponsorId', label:'Sponsor ID'},
        {key:'amount', label:'Amount', render:r=>money(r.amount)},
        {key:'status', label:'Status', render:r=>statusBadge(r.status)},
        {key:'invoiceDate', label:'Date'}
    ],
    fields: [
        {key:'salesOrderId', label:'Sales Order ID', type:'number'},
        {key:'sponsorId', label:'Sponsor ID', type:'number', required:true},
        {key:'amount', label:'Amount (₹)', type:'number', step:'0.01'},
        {key:'status', label:'Status', type:'select', options:[{value:'UNPAID',label:'UNPAID'},{value:'PAID',label:'PAID'},{value:'OVERDUE',label:'OVERDUE'}]},
        {key:'invoiceDate', label:'Invoice Date', type:'date'}
    ]
  });
});
</script>
</body>
</html>

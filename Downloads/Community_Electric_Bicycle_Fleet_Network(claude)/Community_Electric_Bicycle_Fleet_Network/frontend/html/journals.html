<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${title} + ' · eMobility'">eMobility</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar(active='accounting')}"></div>
  <div class="main">
    <div th:replace="~{fragments :: topbar(title=${title})}"></div>
    <main class="content">

      <div class="card" style="margin-bottom:18px">
        <div class="card-head">
          <div><h3>Journals</h3><div class="text-mute" style="font-size:12px">General / Sales / Purchase / Cash / Bank journals</div></div>
          <button class="btn btn-primary" id="addBtn_journals">+ Add Journal</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Actions</th></tr></thead>
            <tbody id="tbody_journals"><tr class="empty-row"><td colspan="4">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div><h3>Journal Entries</h3><div class="text-mute" style="font-size:12px">Debit / credit entries posted to a journal</div></div>
          <button class="btn btn-primary" id="addBtn_je">+ Add Entry</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>ID</th><th>Journal ID</th><th>Description</th><th>Debit</th><th>Credit</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="tbody_je"><tr class="empty-row"><td colspan="7">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  initCrudPage({
    key: 'journals', endpoint: '/api/journals', title: 'Journal',
    tableBodyId: 'tbody_journals', addButtonId: 'addBtn_journals',
    columns: [
      {key:'id', label:'ID'}, {key:'name', label:'Name'}, {key:'type', label:'Type', render:r=>statusBadge(r.type)}
    ],
    fields: [
      {key:'name', label:'Journal Name', required:true},
      {key:'type', label:'Type', type:'select', options:[{value:'GENERAL',label:'GENERAL'},{value:'SALES',label:'SALES'},{value:'PURCHASE',label:'PURCHASE'},{value:'CASH',label:'CASH'},{value:'BANK',label:'BANK'}]}
    ]
  });

  initCrudPage({
    key: 'je', endpoint: '/api/journal-entries', title: 'Journal Entry',
    tableBodyId: 'tbody_je', addButtonId: 'addBtn_je',
    columns: [
      {key:'id', label:'ID'}, {key:'journalId', label:'Journal ID'}, {key:'description', label:'Description'},
      {key:'debit', label:'Debit', render:r=>money(r.debit)}, {key:'credit', label:'Credit', render:r=>money(r.credit)},
      {key:'entryDate', label:'Date'}
    ],
    fields: [
      {key:'journalId', label:'Journal ID', type:'number', required:true},
      {key:'description', label:'Description', required:true},
      {key:'debit', label:'Debit (₹)', type:'number', step:'0.01'},
      {key:'credit', label:'Credit (₹)', type:'number', step:'0.01'},
      {key:'entryDate', label:'Entry Date', type:'date'}
    ]
  });
});
</script>
</body>
</html>
